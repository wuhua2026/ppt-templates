[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-templates"
version = "1.1.0"
description = "230 个预构建 PPT 模板与双语言生成器（Python / TypeScript）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wuhua2026" }]
keywords = ["pptx", "powerpoint", "presentation", "python-pptx", "template"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "python-pptx>=0.6.21",
    "Pillow>=9.0.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/wuhua2026/ppt-templates"
Repository = "https://github.com/wuhua2026/ppt-templates"
Issues = "https://github.com/wuhua2026/ppt-templates/issues"

[tool.setuptools.packages.find]
include = ["python*", "themes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
